# PAO PAO Local Co-op - launcher options
# Lines starting with # are comments.

# Taskbar
#   no  : the taskbar stays visible, the game windows stop above it (recommended)
#   yes : the taskbar is hidden while playing and comes back when the game closes
hide_taskbar=no

# Start
#   no  : both windows open on the menu: Local co-op > Host in one, Join in the other
#   yes : automatic start: the left window loads the last world played, the right one joins it
auto_start=no

# Screens
#   With 2 screens or more, the launcher asks at start: split screen or one screen per player,
#   and which player goes on which screen. To change it later: PaoPaoLocalCoop.exe --screens
#   split : both windows side by side on the main screen
#   dual  : one screen per player (player1_screen / player2_screen, e.g. DISPLAY1, DISPLAY2)
screen_layout=split
player1_screen=
player2_screen=
#   yes : ask at each start when 2 screens or more are connected
#   no  : use the lines above without asking
ask_screens=yes

# Game folder (leave empty: found automatically through Steam)
# Example: game_folder=D:\SteamLibrary\steamapps\common\PaoPao
game_folder=
